
name: management_app_flutter
description: STAFFORA - Employee Management System
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: any

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_svg: any
  flutter_animate: any

  # Date Formatting
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/avatars/
